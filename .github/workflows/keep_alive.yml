name: Keep Render App Awake

on:
  schedule:
    # Runs every 5 minutes (using Cron syntax)
    - cron: '*/5 * * * *'
  # Allows you to manually trigger the ping from GitHub for testing
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Traffic to Render
        run: |
          curl -s https://expenses-ppci.onrender.com
